[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fiscal-xml-validator"
version = "0.1.0"
description = "Validador e auditor de figuras fiscais em XMLs brasileiros (NF-e, NFC-e, CT-e) com diagnóstico explicável e propostas de correção em formato diff."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Fiscal XML Architect Community" }
]
keywords = [
    "nfe",
    "nfce",
    "cte",
    "xml",
    "fiscal",
    "tributario",
    "icms",
    "cfop",
    "cst",
    "csosn",
    "sefaz",
    "sped"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
pdf = [
    "reportlab>=5.0.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "reportlab>=5.0.0",
]

[project.scripts]
fiscal-xml = "fiscal_xml_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

